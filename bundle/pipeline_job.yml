resources:
  jobs:
    pipeline_job:
      name: fin-pipeline
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          max_retries: 1
          notebook_task:
            notebook_path: ../src/bronze/ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/silver/clean.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
